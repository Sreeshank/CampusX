name: Starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npm test
      - run: npm run test:domain
      - name: Build functions scaffold
        run: |
          if [ -f functions/package-lock.json ]; then npm --prefix functions ci; else npm --prefix functions install; fi
          npm run functions:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve generated lockfiles for the leader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfiles
          path: |
            package-lock.json
            functions/package-lock.json
